<!-- Barra nav -->
      <header class="navbar">
        <div class="logo">InkPixi!</div>

        <nav class="nav-links">
          <a href="#" class="active">Inicio</a>
          <a href="#">Mensajes</a>
          <a href="#">Perfil</a>
        </nav>

        <div class="user-info">
          <div class="avatar-placeholder"></div>
          <span>MainYuumi</span>
        </div>
      </header>
      <!-- Contenido central -->
      <main class="container">
        <!--Hero -->
        <section class="hero">
          <div class="hero-info">
            <span class="subtext">InkPixi</span>
            <h1>Tu mundo,<br>tus ideas</h1>
            <hr class="linea">
            <p>Tu mundo, tus ideas, tu espacio.<br>Todo lo que imagines tiene su lugar</p>

            <div class="hero-btns">
              <button class="btn-primary">Explorar trabajos ↗</button>
              <button class="btn-secondary">Crear mi portfolio</button>
            </div>

            <p class="nota-lapiz">Un espacio para mentes que no paran de crear ✧</p>
          </div>
          <div class="hero-images">
            <div class="polaroid polaroid-1">
              <div class="polaroid-box foto-paisaje"></div>
              <p>Descripción de la imagen</p>
            </div>

            <div class="polaroid polaroid-2">
              <div class="polaroid-box foto-personaje"></div>
              <p>Descripción</p>
            </div>

            <span class="nota-flecha">de tu libreta al mundo ➔</span>
          </div>
        </section>
        <!-- Filtro y buscador -->
        <section class="search-section">
          <button class="btn-filter">Filtrar por ↓</button>
          <input type="text" placeholder="Buscar..." class="search-input">
        </section>
        <!-- Galería inferior -->
        <section class="gallery">
          <h2>Descubre más arte</h2>
          <div class="art-grid">
            <div class="art-card">
              <span class="guardar">🔖</span>
              <div class="card-img art-1"></div>
            </div>
            <div class="art-card">
              <span class="guardar"></span>
              <div class="card-img art-2"></div>
            </div>
            <div class="art-card">
              <span class="guardar"></span>
              <div class="card-img art-3"></div>
            </div>
            <div class="art-card">
              <span class="guardar"></span>
              <div class="card-img art-4"></div>
            </div>
          </div>
        </section>
      </main>
