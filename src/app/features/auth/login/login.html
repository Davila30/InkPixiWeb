<div class="auth-page">
  <main class="auth-main">
    <section class="auth-layout" aria-label="Iniciar sesión en InkPixi">
      <app-auth-panel />

      <section class="form-panel">
        <div class="form-content">
          <p class="form-kicker">Qué alegría tenerte de vuelta</p>
          <h2>Inicia sesión</h2>
          <p class="form-intro">Entra en tu espacio creativo y sigue donde lo dejaste.</p>

          <form>
            <label for="login-email">Correo electrónico</label>
            <input
              id="login-email"
              type="email"
              placeholder="hola@ejemplo.com"
              autocomplete="email"
            />

            <label for="login-password">Contraseña</label>
            <input
              id="login-password"
              type="password"
              placeholder="Tu contraseña"
              autocomplete="current-password"
            />

            <button class="submit-button" type="button" routerLink="/profile">Iniciar sesión</button>
          </form>

          <p class="switch-copy">
            ¿Aún no tienes cuenta?
            <a routerLink="/register">Regístrate</a>
          </p>
          <a class="back-link" routerLink="/">← Volver al inicio</a>
        </div>
      </section>
    </section>
  </main>

  <app-footer />
</div>
