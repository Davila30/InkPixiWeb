<div class="auth-page">
  <main class="auth-main">
    <section class="auth-layout" aria-label="Crear una cuenta de InkPixi">
      <app-auth-panel />

      <section class="form-panel">
        <div class="form-content">
          <p class="form-kicker">Tu rincón creativo te espera</p>
          <h2>Crea tu cuenta</h2>
          <p class="form-intro">Únete a la comunidad y comparte todo lo que imaginas.</p>

          <form>
            <label for="register-name">Nombre</label>
            <input
              id="register-name"
              type="text"
              placeholder="¿Cómo te llamas?"
              autocomplete="name"
            />

            <label for="register-email">Correo electrónico</label>
            <input
              id="register-email"
              type="email"
              placeholder="hola@ejemplo.com"
              autocomplete="email"
            />

            <label for="register-password">Contraseña</label>
            <input
              id="register-password"
              type="password"
              placeholder="Mínimo 8 caracteres"
              autocomplete="new-password"
            />

            <label for="register-confirm-password">Confirma tu contraseña</label>
            <input
              id="register-confirm-password"
              type="password"
              placeholder="Repite tu contraseña"
              autocomplete="new-password"
            />

            <button class="submit-button" type="button" routerLink="/profile">Crear cuenta</button>
          </form>

          <p class="switch-copy">
            ¿Ya tienes cuenta?
            <a routerLink="/login">Inicia sesión</a>
          </p>
          <a class="back-link" routerLink="/">← Volver al inicio</a>
        </div>
      </section>
    </section>
  </main>

  <app-footer />
</div>
