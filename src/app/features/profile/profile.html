<div class="profile-page">
  <app-navbar />

  <main class="profile-content">
    <section class="artist-profile" aria-labelledby="artist-name">
      <div class="cover-art" role="img" aria-label="Paisaje ilustrado de fantasía"></div>
      <div class="artist-info">
        <div class="artist-avatar" role="img" aria-label="Avatar ilustrado de Dani Ávila"></div>
        <div class="artist-copy">
          <h1 id="artist-name">Dani Ávila - &#64;MainYuumi</h1>
          <p>Dibujante aficionado a los videojuegos y amante de los perros.</p>
        </div>
        <button class="contact-button" type="button">Contactar</button>
      </div>
    </section>

    <section id="obras" class="featured-section" aria-labelledby="featured-title">
      <h2 id="featured-title">Obras destacadas</h2>
      <div class="featured-panel">
        <h3>Un vistazo a mis mundos</h3>
        <p class="featured-description">
          Escenarios, personajes y pequeños refugios. Cada pieza tiene una historia detrás.
        </p>

        <div class="featured-grid">
          @for (work of featuredWorks; track work.id) {
            <app-art-card [artwork]="work" />
          }
        </div>

        <a class="view-all" href="#obras">Ver todo ↗</a>
      </div>
    </section>
  </main>

  <app-footer />
</div>
