<div class="min-h-screen bg-[#f3f1f0] font-sans text-[#342d3b]">
  <app-navbar />

  <main class="mx-auto w-[min(1200px,100%)] p-3 min-[601px]:px-5 min-[601px]:pt-4 min-[601px]:pb-8">
    <section class="relative rounded-[20px] bg-[#e8dcf5] p-[10px] min-[601px]:rounded-[28px] min-[601px]:p-4" aria-labelledby="artist-name">
      <div
        class="h-[125px] overflow-hidden rounded-[12px] bg-[radial-gradient(ellipse_at_12%_20%,rgba(255,255,255,0.9)_0_9%,transparent_22%),radial-gradient(ellipse_at_76%_18%,rgba(222,243,255,0.8)_0_5%,transparent_24%),linear-gradient(170deg,transparent_0_45%,#8ec5d9_46%_52%,transparent_53%),linear-gradient(160deg,transparent_0_50%,#56a4c5_51%_66%,transparent_67%),linear-gradient(145deg,#b9e3f4_0_38%,#80c4e6_50%,#3b8fba_74%,#26648e_100%)] min-[601px]:h-[clamp(110px,16vw,190px)]"
        role="img"
        aria-label="Paisaje ilustrado de fantasía"
      ></div>

      <div class="flex min-h-0 flex-wrap items-center gap-[10px] px-2 pt-[76px] pb-2 min-[601px]:min-h-[100px] min-[601px]:flex-nowrap min-[601px]:gap-5 min-[601px]:pt-3 min-[601px]:pr-[30px] min-[601px]:pb-1 min-[601px]:pl-[230px]">
        <div
          class="absolute top-[68px] left-5 aspect-square w-[100px] rounded-full border-4 border-[#e8dcf5] bg-[radial-gradient(ellipse_at_50%_55%,#f6d2a3_0_17%,transparent_18%),radial-gradient(ellipse_at_50%_82%,#ae6d44_0_29%,transparent_30%),radial-gradient(ellipse_at_50%_44%,#362e50_0_35%,transparent_36%),radial-gradient(circle_at_50%_50%,#f2c07f_0_58%,#76518f_59%_100%)] shadow-[0_3px_8px_rgba(48,34,57,0.2)] min-[601px]:top-auto min-[601px]:-bottom-[28px] min-[601px]:left-[28px] min-[601px]:w-[150px]"
          role="img"
          aria-label="Avatar ilustrado de Dani Ávila"
        ></div>

        <div class="min-w-0 flex-1 basis-full pl-[108px] min-[601px]:basis-auto min-[601px]:pl-0">
          <h1 id="artist-name" class="m-0 mb-[5px] text-[17px] leading-[1.2] min-[601px]:text-[clamp(18px,2vw,24px)]">
            Dani Ávila - &#64;MainYuumi
          </h1>
          <p class="m-0 max-w-[500px] text-[12px] leading-[1.4] text-[#776b82] min-[601px]:text-[14px]">
            Dibujante aficionado a los videojuegos y amante de los perros.
          </p>
        </div>

        <button
          class="inline-flex min-h-[36px] w-full cursor-pointer items-center justify-center rounded-[24px] border-0 bg-[#8051bc] text-[13px] text-white no-underline hover:bg-[#6d40aa] focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-[#76509a] min-[601px]:min-h-[40px] min-[601px]:w-auto min-[601px]:min-w-[150px]"
          type="button"
        >
          Contactar
        </button>
      </div>
    </section>

    <section id="obras" class="mt-[28px]" aria-labelledby="featured-title">
      <h2 id="featured-title" class="m-0 mb-3 text-[18px] font-medium text-[#938b91]">Obras destacadas</h2>
      <div class="rounded-[12px] border border-[#d5ced4] bg-[#fcfaf9] p-[14px] shadow-[0_2px_3px_rgba(41,31,45,0.12)]">
        <h3 class="m-0 mb-[3px] text-[14px]">Un vistazo a mis mundos</h3>
        <p class="m-0 mb-[10px] text-[11px] text-[#766d79]">
          Escenarios, personajes y pequeños refugios. Cada pieza tiene una historia detrás.
        </p>

        <div class="grid grid-cols-1 gap-4 min-[361px]:grid-cols-2 min-[601px]:grid-cols-[repeat(auto-fill,minmax(220px,1fr))]">
          @for (work of featuredWorks; track work.id) {
            <app-art-card [artwork]="work" />
          }
        </div>

        <a
          class="mt-3 inline-block text-[10px] text-[#8051bc] no-underline focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-[#76509a]"
          href="#obras"
        >
          Ver todo ↗
        </a>
      </div>
    </section>
  </main>

  <app-footer />
</div>
