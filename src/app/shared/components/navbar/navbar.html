<header class="navbar">
  <a class="logo" routerLink="/" aria-label="InkPixi, volver al inicio">
    <img src="/inkPixLogo.png" alt="InkPixi Logo" class="logo-img" />
  </a>

  <nav class="nav-links" aria-label="Navegación principal">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/login" routerLinkActive="active">Login</a>
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/descubrir" routerLinkActive="active">Descubrir</a>
  </nav>

  <div class="auth-status" [class.authenticated]="auth.isAuthenticated()">
    <span class="status-dot" aria-hidden="true"></span>
    {{ auth.isAuthenticated() ? 'Sesión iniciada' : 'Sin sesión' }}
  </div>
</header>
