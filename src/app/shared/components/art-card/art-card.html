<article
  class="relative flex h-full flex-col overflow-hidden rounded-[20px] bg-ink-card p-[14px] text-ink-main min-[421px]:p-[18px]"
>
  <button
    type="button"
    class="absolute top-3 right-3 z-[1] grid size-[34px] cursor-pointer place-items-center rounded-full border-0 bg-ink-card/90 text-ink-main focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-ink-primary"
    [attr.aria-pressed]="saved()"
    [attr.aria-label]="saved() ? 'Quitar de guardados' : 'Guardar ' + artwork().title"
    (click)="toggleSaved()"
  >
    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
      class="size-[18px] stroke-current stroke-[1.8] [stroke-linecap:round] [stroke-linejoin:round]"
      [class.fill-current]="saved()"
      [class.fill-none]="!saved()"
    >
      <path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z" />
    </svg>
  </button>

  <a
    class="flex w-full justify-center text-inherit no-underline focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-ink-primary"
    [routerLink]="['/obra', artwork().id]"
    [attr.aria-label]="'Ver detalle de ' + artwork().title"
  >
    <div
      class="flex aspect-[3/4] w-[82%] items-center justify-center self-center overflow-hidden border-[7px] border-[#514951] bg-[#b7a5c5]"
      [class]="!artwork().imageUrl ? 'shadow-[inset_0_0_0_2px_rgba(255,255,255,0.28)] bg-[radial-gradient(ellipse_at_50%_58%,#e8c447_0_7%,transparent_7.5%),radial-gradient(ellipse_at_50%_57%,#354b46_0_23%,transparent_23.5%),linear-gradient(160deg,transparent_0_28%,#574b82_28%_42%,#386b91_42%_59%,#b8a78d_59%_100%)]' : ''"
    >
      @if (artwork().imageUrl; as url) {
        <img [src]="url" [alt]="artwork().title" loading="lazy" class="block size-full object-cover" />
      }
    </div>
  </a>

  <h3 class="mx-[2px] mt-4 mb-0 truncate text-[16px] font-bold leading-[1.35] text-ink-main">
    <a
      class="text-inherit no-underline hover:text-ink-primary hover:underline focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-ink-primary"
      [routerLink]="['/obra', artwork().id]"
    >
      {{ artwork().title }}
    </a>
  </h3>
  <p class="mx-[2px] mt-[5px] mb-0 truncate text-[12px] leading-[1.4] text-ink-muted">
    por {{ artwork().author }}
  </p>
  <p class="mx-[2px] mt-[7px] mb-0 truncate text-[12px] leading-[1.4] text-ink-muted">
    {{ artwork().category }} · Portfolio
  </p>

  <div
    class="mx-[2px] mt-auto mb-0 flex items-center justify-between gap-2 pt-3 text-[11px] min-[421px]:text-[12px]"
  >
    <button
      type="button"
      class="inline-flex flex-none cursor-pointer items-center gap-[5px] border-0 bg-transparent p-0 font-inherit focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-ink-primary"
      [class.text-ink-primary]="liked()"
      [class.text-ink-muted]="!liked()"
      [attr.aria-pressed]="liked()"
      aria-label="Me gusta"
      (click)="toggleLike()"
    >
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
        class="size-[15px] stroke-current stroke-[1.8]"
        [class.fill-current]="liked()"
        [class.fill-none]="!liked()"
      >
        <path
          d="M12 21l-1.4-1.3C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.2L12 21z"
        />
      </svg>
      <span>{{ likes() }}</span>
    </button>

    <span class="inline-flex items-center gap-1 whitespace-nowrap font-bold text-ink-primary">
      @if (artwork().price !== null) {
        <span>{{ artwork().price }}€ –</span>
      }
      <button
        type="button"
        class="cursor-pointer border-0 bg-transparent p-0 font-inherit text-inherit focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-ink-primary"
        (click)="onViewPortfolio()"
      >
        Ver portfolio ↗
      </button>
    </span>
  </div>
</article>
