<article class="art-card">
  <button
    type="button"
    class="guardar"
    [class.saved]="saved()"
    [attr.aria-pressed]="saved()"
    aria-label="Guardar"
    (click)="toggleSaved()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z" />
    </svg>
  </button>

  <div class="card-img" [class.sin-imagen]="!artwork().imageUrl">
    @if (artwork().imageUrl; as url) {
      <img [src]="url" [alt]="artwork().title" loading="lazy" />
    }
  </div>

  <h3 class="titulo">{{ artwork().title }}</h3>
  <p class="autor">por {{ artwork().author }}</p>
  <p class="categoria">{{ artwork().category }} · Portfolio</p>

  <div class="card-footer">
    <button
      type="button"
      class="likes"
      [class.liked]="liked()"
      [attr.aria-pressed]="liked()"
      aria-label="Me gusta"
      (click)="toggleLike()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 21l-1.4-1.3C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.2L12 21z"
        />
      </svg>
      <span>{{ likes() }}</span>
    </button>

    <span class="acciones">
      @if (artwork().price !== null) {
        <span>{{ artwork().price }}€ –</span>
      }
      <button type="button" class="ver-portfolio">Ver portfolio ↗</button>
    </span>
  </div>
</article>
